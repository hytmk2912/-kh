# sovereign-agent configuration. OWNER-EDITED ONLY.
# The agent reads this file but cannot write it (control/guard.py) and its hash
# is sealed in control/MANIFEST.sha256 (re-seal after edits: python main.py owner-seal).

agent:
  name: sovereign-agent

# Chain used by the on-chain wallet. Owner choice; override per run with
# env CHAIN=base_sepolia or `--chain base_sepolia`.
# base_mainnet = REAL ETH (owner-approved). Receive-only either way.
active_chain: base_mainnet

chains:
  base_mainnet:
    name: base_mainnet
    chain_id: 8453
    rpc_url: https://mainnet.base.org
    explorer: https://basescan.org
    symbol: ETH (Base mainnet)
    min_confirmations: 5        # payment must be this many blocks deep
  base_sepolia:
    name: base_sepolia
    chain_id: 84532
    rpc_url: https://sepolia.base.org
    explorer: https://sepolia.basescan.org
    symbol: ETH (Base Sepolia testnet)
    min_confirmations: 1

# Owner payout. The ONLY address the agent may ever send money to.
# Rule (control/payout.py): wallet >= $1000 -> send $500 here, keep the rest.
# Empty = payouts disabled. After setting it run: python3 main.py owner-seal
owner:
  payout_address: "0xf39d3725b8be130e090b5ab5fd96368319a13b1f"   # owner exchange deposit, network BASE (checked 2026-10-02)

wallet:
  # The agent creates and holds its own key (state/agent_keystore.json,
  # encrypted with AGENT_KEYSTORE_PASSWORD from .env) -> `python3 main.py wallet-init`.
  # onchain: read the real balance of WALLET_ADDRESS (.env) on active_chain.
  #          Outgoing transfers: owner payout only (control/payout.py).
  # mock:    offline JSON wallet in state/ (demo / tests / iPhone)
  backend: onchain
  mock_start_balance_eth: 0.02

# Survival states by effective wallet balance (ETH on the active chain).
# balance >= normal -> Normal; >= low_compute -> Low_compute;
# >= critical -> Critical; below critical -> Dead.
thresholds_eth:
  normal: 0.01
  low_compute: 0.003
  critical: 0.0005

pricing:
  price_per_1k_chars_eth: 0.0002
  min_price_eth: 0.0001

# Book-keeping cost charged per LLM call (models are free; this is the agent's
# internal "metabolism" so the budget logic is exercised). Debited from the
# wallet: mock -> real debit, onchain -> virtual debit in state/ (never sent).
compute_cost_eth:
  Normal: 0.00005
  Low_compute: 0.00002
  Critical: 0          # zero-capital mode never spends
  Dead: 0

policies:
  Normal:
    model_tier: strong
    max_output_tokens: 2048
    accept_jobs: true
    require_prepayment: false
    may_write_skills: true
  Low_compute:
    model_tier: light
    max_output_tokens: 1024
    accept_jobs: true
    require_prepayment: false
    may_write_skills: false
  # Below these lines the agent has (almost) no capital. Owner rule: with 0
  # capital it must still work, but only on ZERO-COST work (free LLMs, free
  # job boards, no ETH spent). Compute cost for these states is 0.
  Critical:
    model_tier: light
    max_output_tokens: 1024
    accept_jobs: true
    require_prepayment: false
    may_write_skills: false
    zero_cost_only: true
  Dead:          # capital = 0 -> "bootstrap": zero-cost work only
    model_tier: light
    max_output_tokens: 1024
    accept_jobs: true
    require_prepayment: false
    may_write_skills: false
    zero_cost_only: true

llm:
  # Tried in order; providers without an API key in .env are skipped.
  # `offline` is a local stub used when no key is configured.
  provider_order: [gemini, groq, openrouter, offline]
  models:
    gemini:     {strong: gemini-flash-latest,       light: gemini-flash-lite-latest}
    groq:       {strong: llama-3.3-70b-versatile,   light: llama-3.1-8b-instant}
    openrouter: {strong: "meta-llama/llama-3.3-70b-instruct:free", light: "mistralai/mistral-7b-instruct:free"}
    offline:    {strong: stub, light: stub}

# Opportunity scout: read-only public job boards, no accounts.
scout:
  every_rounds: 30            # run inside `loop` every N rounds (interval 60s -> 30 min)
  sources: [freelancer, remotive]
  queries: [translation, translate, proofreading, content writing, article writing, copywriting, blog writing]
  max_leads_per_source: 40
  draft_top: 5                # write proposals for the best N new leads
  max_age_hours: 72
